services:
  db:
    image: postgres:16-alpine
    container_name: qonys-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qonys
      POSTGRES_PASSWORD: qonys
      POSTGRES_DB: qonys
    ports:
      - '5432:5432'
    volumes:
      - qonys-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qonys']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: qonys-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qonys:qonys@db:5432/qonys?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev_secret_change_me}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYMENT_PROVIDER: mock
    ports:
      - '3000:3000'

volumes:
  qonys-pgdata:
